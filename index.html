<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculator | Kalu Adannaya</title>
<style>
:root{
  --black:#0d0d0d;
  --coal:#1a1a1a;
  --key:#262626;
  --orange:#cc5500;
  --orange-soft:#e8803a;
  --paper:#f3ece4;
  --muted:#9a9088;
  --red:#d64545;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;display:grid;place-items:center;padding:1.25rem;
  font-family:var(--font);color:var(--paper);
  background:radial-gradient(circle at 20% 15%,rgba(204,85,0,.28),transparent 45%),
             radial-gradient(circle at 85% 90%,rgba(232,128,58,.18),transparent 40%),
             var(--black);
}
.wrap{width:min(360px,100%)}
h1{font-size:1.1rem;text-align:center;margin-bottom:1rem;color:var(--orange-soft);letter-spacing:.08em;text-transform:uppercase}

.calc{
  background:var(--coal);border:1px solid #333;border-radius:26px;padding:1.1rem;
  box-shadow:0 28px 60px rgba(0,0,0,.6),0 0 0 1px rgba(204,85,0,.15);
}

/* display */
.screen{
  background:var(--black);border-radius:16px;padding:1rem 1.1rem;margin-bottom:1rem;
  text-align:right;min-height:112px;display:flex;flex-direction:column;justify-content:flex-end;gap:.35rem;
  border:1px solid #2b2b2b;box-shadow:inset 0 4px 14px rgba(0,0,0,.6);
}
.expr{color:var(--muted);font-size:1.05rem;min-height:1.5em;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.expr::-webkit-scrollbar{display:none}
.result{font-size:2.6rem;font-weight:700;line-height:1.1;overflow-x:auto;white-space:nowrap;scrollbar-width:none;color:var(--paper)}
.result::-webkit-scrollbar{display:none}
.result.err{color:var(--red);font-size:1.3rem}

/* buttons */
.keys{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:64px;gap:.7rem}
.k{
  font:inherit;font-size:1.35rem;font-weight:600;color:var(--paper);
  background:var(--key);border:none;border-radius:16px;cursor:pointer;
  box-shadow:0 4px 0 #111;transition:transform .12s,background .15s,box-shadow .12s;
}
.k:hover{background:#333;transform:translateY(-2px)}
.k:active{transform:translateY(2px) scale(.96);box-shadow:0 1px 0 #111}
.k:focus-visible{outline:3px solid var(--orange-soft);outline-offset:2px}
.k.op{background:var(--orange);color:var(--black);box-shadow:0 4px 0 #8a3a00}
.k.op:hover{background:var(--orange-soft)}
.k.op:active{box-shadow:0 1px 0 #8a3a00}
.k.clear{background:var(--red);color:#fff;box-shadow:0 4px 0 #8f2a2a}
.k.clear:hover{background:#e25a5a}
.k.back{color:var(--orange-soft)}
.k.eq{grid-row:span 2;background:linear-gradient(180deg,var(--orange-soft),var(--orange));color:var(--black);font-size:1.7rem;box-shadow:0 4px 0 #8a3a00}
.k.eq:hover{filter:brightness(1.08)}
.k.zero{grid-column:span 2}

.tip{margin-top:1rem;text-align:center;color:var(--muted);font-size:.85rem}

@media(max-width:380px){
  .keys{grid-auto-rows:58px;gap:.55rem}
  .result{font-size:2.2rem}
}
@media(prefers-reduced-motion:reduce){.k{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <h1>Calculator</h1>
  <div class="calc">

    <div class="screen" aria-live="polite">
      <div class="expr" id="expr"></div>
      <div class="result" id="result">0</div>
    </div>

    <div class="keys">
      <button type="button" class="k clear" data-act="clear" aria-label="Clear all">C</button>
      <button type="button" class="k back" data-act="back" aria-label="Delete last">⌫</button>
      <button type="button" class="k op" data-op="÷" aria-label="Divide">÷</button>
      <button type="button" class="k op" data-op="×" aria-label="Multiply">×</button>

      <button type="button" class="k" data-num="7">7</button>
      <button type="button" class="k" data-num="8">8</button>
      <button type="button" class="k" data-num="9">9</button>
      <button type="button" class="k op" data-op="−" aria-label="Subtract">−</button>

      <button type="button" class="k" data-num="4">4</button>
      <button type="button" class="k" data-num="5">5</button>
      <button type="button" class="k" data-num="6">6</button>
      <button type="button" class="k op" data-op="+" aria-label="Add">+</button>

      <button type="button" class="k" data-num="1">1</button>
      <button type="button" class="k" data-num="2">2</button>
      <button type="button" class="k" data-num="3">3</button>
      <button type="button" class="k eq" data-act="equals" aria-label="Equals">=</button>

      <button type="button" class="k zero" data-num="0">0</button>
      <button type="button" class="k" data-dot="1" aria-label="Decimal point">.</button>
    </div>

  </div>
  <p class="tip">Tip: you can also use your keyboard. Enter gives the answer, Esc clears.</p>
</div>

<script>
var exprEl=document.getElementById('expr');
var resEl=document.getElementById('result');
var expr='';          // what the user has typed
var justEvaluated=false;
var topLine='';       // small line shown after pressing =

function isOp(x){return x==='+'||x==='−'||x==='×'||x==='÷';}

// work out the answer, respecting × and ÷ before + and −
function calc(s){
  var t=s.match(/\d+\.?\d*|\.\d+|[+−×÷]/g);
  if(!t)return null;
  var out=[],i,x,n;
  for(i=0;i<t.length;i++){
    x=t[i];
    if(x==='−'&&(i===0||isOp(t[i-1]))){
      n=t[i+1];
      if(n===undefined||isOp(n))return null;
      out.push(-parseFloat(n));i++;
    }else if(isOp(x)){out.push(x);}
    else{out.push(parseFloat(x));}
  }
  if(out.length%2===0)return null;
  var a=[out[0]],op,r;
  for(i=1;i<out.length;i+=2){
    op=out[i];r=out[i+1];
    if(op==='×'){a[a.length-1]*=r;}
    else if(op==='÷'){if(r===0)return{err:true};a[a.length-1]/=r;}
    else{a.push(op,r);}
  }
  var v=a[0];
  for(i=1;i<a.length;i+=2){v=a[i]==='+'?v+a[i+1]:v-a[i+1];}
  return{val:v};
}

function fmt(v){return String(Number(v.toPrecision(12)));}

function hasOperator(s){return /[+×÷]/.test(s)||/.−/.test(s);}

// update the screen (the result changes in real time as you type)
function render(){
  var shown=expr.replace(/([+−×÷])/g,' $1 ').trim();
  exprEl.textContent=justEvaluated?topLine:shown;
  resEl.className='result';

  var live=expr;
  if(isOp(live.slice(-1)))live=live.slice(0,-1);
  if(live.slice(-1)==='.')live=live.slice(0,-1);

  var text;
  if(justEvaluated){
    text=expr;
  }else if(hasOperator(live)){
    var c=calc(live);
    if(c&&c.err){text="Can't divide by 0";resEl.className='result err';}
    else if(c){text=fmt(c.val);}
    else{text=expr||'0';}
  }else{
    text=expr||'0';
  }
  resEl.textContent=text;
  var len=text.length;
  resEl.style.fontSize=resEl.className.indexOf('err')>-1?'':(len>14?'1.6rem':len>10?'2.1rem':'');
  exprEl.scrollLeft=exprEl.scrollWidth;
}

function lastNumber(){var m=expr.match(/(\d*\.?\d*)$/);return m?m[1]:'';}

function inputNumber(d){
  if(justEvaluated){expr='';justEvaluated=false;}
  var seg=lastNumber();
  if(seg==='0'){expr=expr.slice(0,-1);}   // no leading zeros
  expr+=d;
  render();
}

function inputDot(){
  if(justEvaluated){expr='';justEvaluated=false;}
  var seg=lastNumber();
  if(seg.indexOf('.')>-1)return;
  if(seg==='')expr+='0';
  expr+='.';
  render();
}

function inputOp(o){
  justEvaluated=false;
  if(expr===''){
    if(o==='−'){expr='−';render();}
    return;
  }
  if(expr==='−')return;
  var last=expr.slice(-1);
  if(isOp(last)){
    if(expr.length===1)return;
    expr=expr.slice(0,-1);
  }
  if(last==='.')expr=expr.slice(0,-1);
  expr+=o;
  render();
}

function equals(){
  if(expr===''||justEvaluated)return;
  var s=expr;
  if(isOp(s.slice(-1)))s=s.slice(0,-1);
  if(s.slice(-1)==='.')s=s.slice(0,-1);
  if(!hasOperator(s))return;
  var c=calc(s);
  if(!c)return;
  if(c.err){
    resEl.textContent="Can't divide by 0";resEl.className='result err';resEl.style.fontSize='';
    return;
  }
  topLine=s.replace(/([+−×÷])/g,' $1 ').trim()+' =';
  expr=fmt(c.val).replace('-','−');
  justEvaluated=true;
  render();
}

function clearAll(){expr='';topLine='';justEvaluated=false;render();}

function back(){
  if(justEvaluated){clearAll();return;}
  expr=expr.slice(0,-1);
  render();
}

// mouse and touch
document.querySelector('.keys').addEventListener('click',function(e){
  var b=e.target.closest('button');
  if(!b)return;
  if(b.dataset.num!==undefined)inputNumber(b.dataset.num);
  else if(b.dataset.dot)inputDot();
  else if(b.dataset.op)inputOp(b.dataset.op);
  else if(b.dataset.act==='equals')equals();
  else if(b.dataset.act==='clear')clearAll();
  else if(b.dataset.act==='back')back();
});

// keyboard support
document.addEventListener('keydown',function(e){
  var k=e.key;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(k>='0'&&k<='9'){inputNumber(k);}
  else if(k==='.'||k===','){inputDot();}
  else if(k==='+'){inputOp('+');}
  else if(k==='-'){inputOp('−');}
  else if(k==='*'||k==='x'||k==='X'){inputOp('×');}
  else if(k==='/'){e.preventDefault();inputOp('÷');}
  else if(k==='Enter'||k==='='){e.preventDefault();equals();}
  else if(k==='Backspace'){back();}
  else if(k==='Escape'||k==='Delete'){clearAll();}
});

render();
</script>
</body>
</html>
